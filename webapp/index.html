<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css?family=Inconsolata&display=swap"
      rel="stylesheet"
    />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Browse Wearables, Emotes, LAND, and NAMEs in the Decentraland Marketplace. Customize your avatar, explore creations, and find items from the community."
    />
    <link
      rel="sitemap"
      type="application/xml"
      title="Sitemap"
      href="/sitemap.xml"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:site_name" content="Decentraland Marketplace" />
    <!-- Names this app for agents and search engines, and tells it apart from the Shop. It describes the
         site, not a page, so it holds on every route this file is served for. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Decentraland Marketplace",
        "url": "https://decentraland.org/marketplace/",
        "description": "Browse Wearables, Emotes, LAND, and NAMEs in the Decentraland Marketplace. The Marketplace is its own app, separate from the Decentraland Shop (https://decentraland.org/shop/), which offers wearables and emotes for your avatar.",
        "inLanguage": "en",
        "isPartOf": {
          "@type": "WebSite",
          "name": "Decentraland",
          "url": "https://decentraland.org/"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Decentraland",
          "url": "https://decentraland.org/"
        }
      }
    </script>
    <title>Decentraland Marketplace | Wearables, LAND, and NAMEs</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/node.ts"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
